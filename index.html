<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mathe Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
  body{overflow:auto;}
  .hub{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:16px;}
  .hub h1{margin:0;font-size:clamp(40px,8vw,110px);color:#fff;text-shadow:0 6px 0 var(--sea-deep);text-align:center;line-height:1.05;}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,28px);width:100%;max-width:1000px;}
  .card{background:#fff;border-radius:32px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:0 10px 0 rgba(0,0,0,.18);transition:transform .12s;text-align:center;}
  .card:active{transform:translateY(7px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:clamp(56px,9vw,110px);line-height:1;animation:float 3s ease-in-out infinite;}
  .card:nth-child(2) .ico{animation-delay:-1s;}
  .card:nth-child(3) .ico{animation-delay:-2s;}
  @keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
  .card .name{font-size:clamp(20px,2.8vw,34px);font-weight:700;}
  .card .sample{font-size:clamp(15px,2vw,24px);font-weight:700;color:#fff;background:var(--sea-deep);border-radius:12px;padding:0 10px;}
  .card .got{font-size:clamp(15px,2vw,22px);font-weight:700;opacity:.8;}
  .top{position:fixed;top:12px;right:16px;z-index:5;}
  @media (orientation:portrait) and (max-width:700px){ .cards{grid-template-columns:1fr;max-width:340px;} }
</style>
</head>
<body>
  <button class="pill top" id="langBtn" aria-label="Language"></button>
  <main class="hub">
    <h1>🏝️ Mathe Island</h1>
    <nav class="cards">
      <a class="card" href="island-hopper.html">
        <span class="ico">🐸</span><span class="name">Island Hopper</span>
        <span class="sample">0 → +3 → +2</span><span class="got" id="s0"></span>
      </a>
      <a class="card" href="volcano.html">
        <span class="ico">🌋</span><span class="name" id="n1"></span>
        <span class="sample">2 + 3 = 5</span><span class="got" id="s1"></span>
      </a>
      <a class="card" href="beach.html">
        <span class="ico">🐢</span><span class="name" id="n2"></span>
        <span class="sample">🐢🐢🐢 − 1</span><span class="got" id="s2"></span>
      </a>
    </nav>
  </main>
<script src="kit.js"></script>
<script>
  const NAMES = { en: ['Volcano Tower', 'Turtle Beach'], de: ['Vulkan-Turm', 'Schildkröten-Strand'] };
  const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
  function render() {
    const [v, b] = NAMES[Kit.lang];
    document.getElementById('n1').textContent = v;
    document.getElementById('n2').textContent = b;
    document.getElementById('s0').textContent = '⭐ ' + sum(Kit.store.json('ih-stars', []));
    document.getElementById('s1').textContent = '⭐ ' + sum(Kit.store.json('mathe-volcano-stars', []));
    document.getElementById('s2').textContent = '⭐ ' + sum(Kit.store.json('mathe-beach-stars', []));
  }
  Kit.bindLangButton(document.getElementById('langBtn'), render);
  render();
  addEventListener('pageshow', render); // refresh stars when coming back with the browser's back button
</script>
</body>
</html>
