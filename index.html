<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mathe Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="kit.css">
<style>
  body{overflow:auto;}
  .hub{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3vh;padding:16px;}
  .hub h1{margin:0;font-size:clamp(40px,8vw,110px);color:#fff;text-shadow:0 6px 0 var(--sea-deep);text-align:center;line-height:1.05;}
  .cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,28px);width:100%;max-width:1000px;}
  .card{background:#fff;border-radius:32px;padding:18px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:6px;
    box-shadow:0 10px 0 rgba(0,0,0,.18);transition:transform .12s;text-align:center;}
  .card:active{transform:translateY(7px);box-shadow:0 3px 0 rgba(0,0,0,.18);}
  .card .ico{font-size:clamp(56px,9vw,110px);line-height:1;animation:float 3s ease-in-out infinite;}
  .card:nth-child(2) .ico{animation-delay:-1s;}
  .card:nth-child(3) .ico{animation-delay:-2s;}
  @keyframes float{50%{transform:translateY(-8px) rotate(-3deg)}}
  .card .name{font-size:clamp(20px,2.8vw,34px);font-weight:700;}
  .card .sample{font-size:clamp(15px,2vw,24px);font-weight:700;color:#fff;background:var(--sea-deep);border-radius:12px;padding:0 10px;}
  .card .got{font-size:clamp(15px,2vw,22px);font-weight:700;opacity:.8;}
  /* ---------- Buy me a coffee (parents only: lives on the map, not in the games) ---------- */
  .coffee-btn{margin-top:1vh;display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;background:rgba(255,255,255,.9);
    border-radius:999px;padding:8px 18px;font-size:clamp(15px,1.8vw,20px);font-weight:700;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.12);}
  .coffee-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
  .coffee-backdrop{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(27,120,181,.6);}
  .coffee-backdrop.show{display:flex;}
  .coffee-modal{--surface:#FFFFFF;--accent-warm:var(--gold);background:#fff;border-radius:28px;padding:22px 22px 18px;max-width:360px;width:100%;
    text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.18);animation:kit-pop .4s ease;max-height:100%;overflow:auto;}
  .coffee-modal h3{margin:0 0 6px;font-size:24px;}
  .coffee-modal p{margin:0 0 14px;font-size:15px;color:#5B6478;line-height:1.35;font-family:system-ui,sans-serif;}
  .coffee-qr{display:block;width:min(200px,60vw);margin:0 auto 14px;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.15);overflow:hidden;}
  .coffee-qr svg{display:block;width:100%;height:auto;}
  .coffee-cta{display:block;background:linear-gradient(180deg,#FFD66B,var(--gold));color:var(--ink);font-weight:700;font-size:18px;border-radius:16px;padding:12px;
    box-shadow:0 5px 0 #C99A1E;}
  .coffee-close{margin-top:12px;width:100%;border:none;background:#EEF2F7;border-radius:16px;padding:10px;font-size:16px;font-weight:700;color:#5B6478;cursor:pointer;}
  .top{position:fixed;top:12px;right:16px;z-index:5;}
  @media (orientation:portrait) and (max-width:700px){ .cards{grid-template-columns:1fr;max-width:340px;} }
</style>
</head>
<body>
  <button class="pill top" id="langBtn" aria-label="Language"></button>
  <main class="hub">
    <h1>🏝️ Mathe Island</h1>
    <nav class="cards">
      <a class="card" href="island-hopper.html">
        <span class="ico">🐸</span><span class="name">Island Hopper</span>
        <span class="sample">0 → +3 → +2</span><span class="got" id="s0"></span>
      </a>
      <a class="card" href="volcano.html">
        <span class="ico">🌋</span><span class="name" id="n1"></span>
        <span class="sample">2 + 3 = 5</span><span class="got" id="s1"></span>
      </a>
      <a class="card" href="beach.html">
        <span class="ico">🐢</span><span class="name" id="n2"></span>
        <span class="sample">🐢🐢🐢 − 1</span><span class="got" id="s2"></span>
      </a>
    </nav>
    <button class="coffee-btn" id="coffeeBtn"><span>☕</span><span id="coffeeCta"></span></button>
  </main>
  <div class="coffee-backdrop" id="coffeeBackdrop" role="dialog" aria-modal="true" aria-labelledby="coffeeTitle">
    <div class="coffee-modal">
      <h3 id="coffeeTitle"></h3>
      <p id="coffeeMsg"></p>
      <a class="coffee-qr" id="coffeeQr" target="_blank" rel="noopener"></a>
      <a class="coffee-cta" id="coffeeLink" target="_blank" rel="noopener"></a>
      <button class="coffee-close" id="coffeeClose"></button>
    </div>
  </div>

    en: { title: 'Enjoying Mathe Island?', msg: 'If these games helped your child with numbers, you can buy me a coffee – totally optional, always appreciated!', cta: 'Buy me a coffee', close: 'Maybe later' },

  const sum = a => a.reduce((s, v) => s + (+v || 0), 0);
  function render() {
    const [v, b] = NAMES[Kit.lang];
    document.getElementById('n1').textContent = v;
    document.getElementById('n2').textContent = b;
    document.getElementById('s0').textContent = '⭐ ' + sum(Kit.store.json('ih-stars', []));

    document.getElementById('s2').textContent = '⭐ ' + sum(Kit.store.json('mathe-beach-stars', []));

    document.getElementById('coffeeCta').textContent = c.cta;
    document.getElementById('coffeeTitle').textContent = c.title;
